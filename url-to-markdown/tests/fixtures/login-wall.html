<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In — Ledgerline</title>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <h1>Log in to continue</h1>
    <p>Access your Ledgerline workspace, saved reports, and team dashboards.</p>
    <form action="/session" method="post">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@company.com" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" required>
      <button type="submit">Continue</button>
    </form>
    <div class="auth-divider"><span>or</span></div>
    <button class="oauth-google">Continue with Google</button>
    <button class="oauth-sso">Continue with SSO</button>
    <p class="auth-footer">Don't have an account? <a href="/signup">Sign up</a></p>
    <p class="auth-footer"><a href="/forgot-password">Forgot your password?</a></p>
  </div>
</div>
</body>
</html>
