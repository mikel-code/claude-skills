# Secrets registry for the granola skill — single source of truth.
# States: enabled = false (dormant) | true (health check must be able to resolve it).
# Mode A = Proton Pass agent-backed reference. The plaintext key never appears
# here, in the skill, or in any shell — it is resolved by pass-cli at spawn
# time and injected only into the client process.

[services.granola]
env_var   = "GRANOLA_API_KEY"
reference = "pass://Agents/Granola/API Key"
enabled   = false
mode      = "A"
notes     = "Granola public API key (grn_…), read-only access to meeting notes. Consumed exclusively via scripts/granola.sh."
